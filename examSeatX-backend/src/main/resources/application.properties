# ===================================================
# ExamSeatX - Application Configuration
# ===================================================

# Server Port (supports cloud platforms like Render, Railway, etc.)
server.port=${PORT:8080}

# Application Name
spring.application.name=ExamSeatX

# -----------------------------------------------
# H2 In-Memory Database Configuration
# -----------------------------------------------
spring.datasource.url=jdbc:h2:mem:examseatxdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (Access at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# -----------------------------------------------
# Logging
# -----------------------------------------------
logging.level.com.examseatx=DEBUG
logging.level.org.springframework.security=WARN

# -----------------------------------------------
# File Upload Settings (for CSV)
# -----------------------------------------------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# -----------------------------------------------
# CORS (allow React dev server)
# -----------------------------------------------
app.cors.allowed-origins=http://localhost:5173
